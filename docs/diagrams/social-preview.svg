<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a2a"/>
      <stop offset="1" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#00c47a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#2a4460" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- DNA / OS icon -->
  <g transform="translate(100, 180)" filter="url(#glow)">
    <text x="0" y="0" font-size="180" fill="url(#accent)">🧬</text>
  </g>

  <!-- Title -->
  <text x="320" y="245" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">agentic-os</text>

  <!-- Tagline line 1 -->
  <text x="320" y="310" font-size="32" font-weight="500" fill="#8CA8C0">A personal operating system on top of Claude Code.</text>

  <!-- Tagline line 2 -->
  <text x="320" y="358" font-size="26" font-weight="400" fill="#8CA8C0">Agents · Memory · Hooks · Skills · Governance</text>
  <text x="320" y="392" font-size="26" font-weight="400" fill="#8CA8C0">built into the harness, not improvised per session.</text>

  <!-- Pills row -->
  <g transform="translate(320, 450)" font-size="20" font-weight="600">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="48" rx="24" fill="#1a3a5c" stroke="#4a9eff" stroke-width="1.5"/>
      <text x="90" y="32" text-anchor="middle" fill="#ffffff">🪝 5 hooks</text>
    </g>
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="180" height="48" rx="24" fill="#1a3a5c" stroke="#4a9eff" stroke-width="1.5"/>
      <text x="90" y="32" text-anchor="middle" fill="#ffffff">🤖 10 agents</text>
    </g>
    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="180" height="48" rx="24" fill="#1a3a5c" stroke="#4a9eff" stroke-width="1.5"/>
      <text x="90" y="32" text-anchor="middle" fill="#ffffff">⚡ 13 skills</text>
    </g>
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="220" height="48" rx="24" fill="#1a3a5c" stroke="#4a9eff" stroke-width="1.5"/>
      <text x="110" y="32" text-anchor="middle" fill="#ffffff">🧩 8 patterns</text>
    </g>
  </g>

  <!-- Footer bar -->
  <rect x="0" y="600" width="1280" height="40" fill="#0a1520"/>
  <text x="100" y="627" font-size="20" font-weight="500" fill="#8CA8C0">github.com/DScardini91/agentic-os</text>
  <text x="1180" y="627" text-anchor="end" font-size="20" font-weight="500" fill="url(#accent)">v1.1 · MIT</text>
</svg>
