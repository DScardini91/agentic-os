name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          # python3 ships with the runner

      - name: Make scripts executable
        run: |
          chmod +x .claude/hooks/*.sh
          chmod +x control-plane/scripts/*.sh
          chmod +x control-plane/scripts/tests/*.sh

      - name: Validate harness (skills, agents, memory frontmatter)
        run: bash control-plane/scripts/validate-harness.sh

      - name: Test block-pr-merge regex
        run: bash control-plane/scripts/tests/test-block-pr-merge.sh

      - name: Compile skill routing
        run: python3 control-plane/scripts/compile-skill-routing.py

      - name: Compile concept routing
        run: python3 control-plane/scripts/compile-concept-routing.py

      - name: Lint YAML configs
        run: |
          python3 - <<'EOF'
          import sys, yaml, pathlib
          errors = []
          for p in pathlib.Path("control-plane/config").glob("*.yaml"):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  errors.append(f"{p}: {e}")
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print("All YAML configs parse cleanly.")
          EOF

      - name: Smoke test install.sh (--check mode, no mutations)
        run: |
          # Add yq to test the optional-prereq path is OK without it
          # Verify --check exits 0 and reports prereqs cleanly
          bash scripts/install.sh --check || (echo "install.sh --check FAILED" && exit 1)
          # Verify full install on fresh checkout (in CI, scripts not yet exec)
          bash scripts/install.sh --quiet || (echo "install.sh FAILED" && exit 1)

      - name: Smoke test bootstrap-progress.sh contract
        run: |
          mkdir -p /tmp/bp-ci-test
          touch /tmp/bp-ci-test/.bootstrap-pending
          CLAUDE_PROJECT_DIR=/tmp/bp-ci-test bash control-plane/scripts/bootstrap-progress.sh status >/dev/null
          NXT=$(CLAUDE_PROJECT_DIR=/tmp/bp-ci-test bash control-plane/scripts/bootstrap-progress.sh next)
          test "$NXT" = "1_identity" || (echo "expected next=1_identity, got $NXT" && exit 1)
          CLAUDE_PROJECT_DIR=/tmp/bp-ci-test bash control-plane/scripts/bootstrap-progress.sh complete 1_identity >/dev/null
          CLAUDE_PROJECT_DIR=/tmp/bp-ci-test bash control-plane/scripts/bootstrap-progress.sh complete 2_harness_naming >/dev/null
          CLAUDE_PROJECT_DIR=/tmp/bp-ci-test bash control-plane/scripts/bootstrap-progress.sh complete 3_domains >/dev/null
          OUT=$(CLAUDE_PROJECT_DIR=/tmp/bp-ci-test bash control-plane/scripts/bootstrap-progress.sh complete 4_technical_wiring)
          echo "$OUT" | grep -q "ALL_COMPLETE" || (echo "ALL_COMPLETE not emitted: $OUT" && exit 1)
          test ! -f /tmp/bp-ci-test/.bootstrap-pending || (echo "sentinel not removed" && exit 1)
          test ! -f /tmp/bp-ci-test/.bootstrap-progress.json || (echo "progress file not removed" && exit 1)
          echo "bootstrap-progress.sh contract OK"

      - name: Check markdown link integrity (control-plane + root)
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          ROOT = pathlib.Path(".")
          broken = []
          scan = list(ROOT.glob("*.md")) + list(ROOT.rglob("control-plane/**/*.md"))
          for f in scan:
              text = f.read_text()
              for m in re.finditer(r'\[[^\]]+\]\(([^)]+)\)', text):
                  link = m.group(1).split("#")[0]
                  if not link or link.startswith(("http", "mailto:")):
                      continue
                  target = (f.parent / link).resolve()
                  if not target.exists():
                      broken.append(f"{f}: {link} -> {target}")
          if broken:
              for b in broken: print(b)
              sys.exit(1)
          print("All internal markdown links resolve.")
          EOF
