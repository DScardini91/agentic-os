name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          # python3 ships with the runner

      - name: Make scripts executable
        run: |
          chmod +x .claude/hooks/*.sh
          chmod +x control-plane/scripts/*.sh
          chmod +x control-plane/scripts/tests/*.sh

      - name: Validate harness (skills, agents, memory frontmatter)
        run: bash control-plane/scripts/validate-harness.sh

      - name: Test block-pr-merge regex
        run: bash control-plane/scripts/tests/test-block-pr-merge.sh

      - name: Compile skill routing
        run: python3 control-plane/scripts/compile-skill-routing.py

      - name: Compile concept routing
        run: python3 control-plane/scripts/compile-concept-routing.py

      - name: Lint YAML configs
        run: |
          python3 - <<'EOF'
          import sys, yaml, pathlib
          errors = []
          for p in pathlib.Path("control-plane/config").glob("*.yaml"):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  errors.append(f"{p}: {e}")
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print("All YAML configs parse cleanly.")
          EOF

      - name: Smoke test install.sh (--check mode, no mutations)
        run: |
          # Add yq to test the optional-prereq path is OK without it
          # Verify --check exits 0 and reports prereqs cleanly
          bash scripts/install.sh --check || (echo "install.sh --check FAILED" && exit 1)
          # Verify full install on fresh checkout (in CI, scripts not yet exec)
          bash scripts/install.sh --quiet || (echo "install.sh FAILED" && exit 1)

      - name: Smoke test bootstrap-progress.sh contract
        run: |
          mkdir -p /tmp/bp-ci-test
          touch /tmp/bp-ci-test/.bootstrap-pending
          PROGRESS="control-plane/scripts/bootstrap-progress.sh"
          export CLAUDE_PROJECT_DIR=/tmp/bp-ci-test

          # Test 1: virgin state — next reports first block
          NXT=$(bash $PROGRESS next)
          test "$NXT" = "1_identity" || (echo "Test 1 FAIL: expected next=1_identity, got $NXT" && exit 1)

          # Test 2: full 4-block flow → ALL_COMPLETE + cleanup
          bash $PROGRESS complete 1_identity >/dev/null
          bash $PROGRESS complete 2_harness_naming >/dev/null
          bash $PROGRESS complete 3_domains >/dev/null
          OUT=$(bash $PROGRESS complete 4_technical_wiring)
          echo "$OUT" | grep -q "ALL_COMPLETE" || (echo "Test 2 FAIL: ALL_COMPLETE not emitted: $OUT" && exit 1)
          test ! -f /tmp/bp-ci-test/.bootstrap-pending || (echo "Test 2 FAIL: sentinel not removed" && exit 1)
          test ! -f /tmp/bp-ci-test/.bootstrap-progress.json || (echo "Test 2 FAIL: progress file not removed" && exit 1)

          # Test 3: post-bootstrap — next must return "done", NOT re-init the progress file
          NXT=$(bash $PROGRESS next)
          test "$NXT" = "done" || (echo "Test 3 FAIL (phantom re-init regression): expected done, got $NXT" && exit 1)
          test ! -f /tmp/bp-ci-test/.bootstrap-progress.json || (echo "Test 3 FAIL: next created phantom progress file" && exit 1)

          # Test 4: status reports bootstrapped state without side-effects
          STATUS=$(bash $PROGRESS status)
          echo "$STATUS" | jq -e '.state == "bootstrapped"' >/dev/null || (echo "Test 4 FAIL: status did not report bootstrapped: $STATUS" && exit 1)
          test ! -f /tmp/bp-ci-test/.bootstrap-progress.json || (echo "Test 4 FAIL: status created phantom progress file" && exit 1)

          # Test 5: start refused without sentinel
          set +e
          bash $PROGRESS start 1_identity 2>/tmp/bp-err
          RC=$?
          set -e
          test "$RC" != "0" || (echo "Test 5 FAIL: start should refuse without sentinel" && exit 1)
          grep -q "refused" /tmp/bp-err || (echo "Test 5 FAIL: refusal message missing" && exit 1)

          # Test 6: mid-bootstrap resume from in_progress block
          touch /tmp/bp-ci-test/.bootstrap-pending
          bash $PROGRESS start 1_identity >/dev/null
          bash $PROGRESS complete 1_identity >/dev/null
          bash $PROGRESS start 2_harness_naming >/dev/null
          NXT=$(bash $PROGRESS next)
          test "$NXT" = "2_harness_naming" || (echo "Test 6 FAIL: expected resume on 2_harness_naming, got $NXT" && exit 1)

          # Test 7: status/next in a non-agentic-os directory → exit 4
          mkdir -p /tmp/random-dir
          rm -rf /tmp/random-dir/.bootstrap-pending /tmp/random-dir/.bootstrap-progress.json /tmp/random-dir/.claude /tmp/random-dir/control-plane
          set +e
          OUT=$(CLAUDE_PROJECT_DIR=/tmp/random-dir bash $PROGRESS status)
          RC=$?
          set -e
          test "$RC" = "4" || (echo "Test 7 FAIL: status in random dir should exit 4, got $RC" && exit 1)
          echo "$OUT" | jq -e '.state == "not-an-agentic-os-repo"' >/dev/null || (echo "Test 7 FAIL: state should be not-an-agentic-os-repo: $OUT" && exit 1)
          set +e
          CLAUDE_PROJECT_DIR=/tmp/random-dir bash $PROGRESS next 2>/dev/null
          RC=$?
          set -e
          test "$RC" = "4" || (echo "Test 7 FAIL: next in random dir should exit 4, got $RC" && exit 1)

          echo "bootstrap-progress.sh contract OK — 7/7 tests pass"

      - name: Check markdown link integrity (control-plane + root)
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          ROOT = pathlib.Path(".")
          broken = []
          scan = list(ROOT.glob("*.md")) + list(ROOT.rglob("control-plane/**/*.md"))
          for f in scan:
              text = f.read_text()
              for m in re.finditer(r'\[[^\]]+\]\(([^)]+)\)', text):
                  link = m.group(1).split("#")[0]
                  if not link or link.startswith(("http", "mailto:")):
                      continue
                  target = (f.parent / link).resolve()
                  if not target.exists():
                      broken.append(f"{f}: {link} -> {target}")
          if broken:
              for b in broken: print(b)
              sys.exit(1)
          print("All internal markdown links resolve.")
          EOF
